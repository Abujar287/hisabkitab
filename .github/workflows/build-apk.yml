name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies & Build Web
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Sync Capacitor Android
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK for Clarity
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk Hisab-Kitab.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hisab-Kitab-Android-APK
        path: Hisab-Kitab.apk
        retention-days: 30
